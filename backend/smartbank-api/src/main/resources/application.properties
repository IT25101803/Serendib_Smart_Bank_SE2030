spring.application.name=smartbank-api
# Load local credentials when launched from the repository root or backend directory.
spring.config.import=optional:file:./backend/smartbank-api/.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutricare?createDatabaseIfNotExist=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

server.port=${PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never
jwt.secret=${JWT_SECRET:fFR4lwMXpTD38wRpU4hjnZHYSmWiTq+Scy1wkNL8IV/p1Edl1U1Y98U3ecjnhurmg3sg54CNoJ+P7B4KcIlC5g==}
bank.security.jwt-hours=24
bank.security.idle-minutes=10
bank.cors.origins=${CORS_ORIGINS:http://localhost:5173}
bank.otp.simulation-enabled=${BANK_OTP_SIMULATION_ENABLED:false}
bank.otp.ttl-seconds=180
bank.otp.max-attempts=5
bank.otp.resend-seconds=30
# Academic demonstration rates only. The backend owns all pricing/calculation.
bank.fixed-deposit.minimum-amount=${FD_MINIMUM_AMOUNT:1000.00}
bank.fixed-deposit.rates[3]=${FD_RATE_3:5.00}
bank.fixed-deposit.rates[6]=${FD_RATE_6:6.00}
bank.fixed-deposit.rates[12]=${FD_RATE_12:7.00}

exchange-rate.api-key=${EXCHANGE_RATE_API_KEY:}

# Opt-in local demonstration administrator (admin / admin).
bank.demo.admin-enabled=${BANK_DEMO_ADMIN_ENABLED:false}

# Opt-in local demonstration manager and staff accounts.
bank.demo.staff-enabled=${BANK_DEMO_STAFF_ENABLED:false}

